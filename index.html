<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tooling Job Log</title>
<meta name="description" content="Offline mold/job reference sheets for the injection molding floor: process sheets, setup checklists, run log, photos, scan-to-fill.">
<meta name="theme-color" content="#0d3f7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --surface:#fff; --surface-2:#f4f6f9; --border:#d9dfe6;
  --text:#1a2733; --text-dim:#56657a; --text-faint:#8492a0;
  --primary:#0d3f7a; --primary-dim:#e6eef8; --primary-ink:#fff;
  --accent:#a8792e; --accent-dim:#f7efe1;
  --danger:#b3392c; --danger-dim:#fbeceb; --good:#1f8a4d; --good-dim:#e6f5ec;
  --warn:#9a6a00; --warn-dim:#fff4d6; --hold:#7a4b9a; --hold-dim:#f2eaf8;
  --radius:12px; --tap:48px;
  --shadow:0 1px 2px rgba(16,30,50,.06),0 2px 8px rgba(16,30,50,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1318; --surface:#161d24; --surface-2:#1c252e; --border:#2a3540;
    --text:#eef1f4; --text-dim:#a1adb8; --text-faint:#6f7d89;
    --primary:#6aa7e2; --primary-dim:#182a3c; --primary-ink:#08131f;
    --accent:#d4b06e; --accent-dim:#2d2616;
    --danger:#ec7063; --danger-dim:#3a1f1d; --good:#52c285; --good-dim:#15311f;
    --warn:#e7b949; --warn-dim:#332913; --hold:#c39be0; --hold-dim:#2b2035;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161d24; --surface-2:#1c252e; --border:#2a3540;
  --text:#eef1f4; --text-dim:#a1adb8; --text-faint:#6f7d89;
  --primary:#6aa7e2; --primary-dim:#182a3c; --primary-ink:#08131f;
  --accent:#d4b06e; --accent-dim:#2d2616;
  --danger:#ec7063; --danger-dim:#3a1f1d; --good:#52c285; --good-dim:#15311f;
  --warn:#e7b949; --warn-dim:#332913; --hold:#c39be0; --hold-dim:#2b2035;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Barlow',sans-serif}
input,textarea,select,button{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 14px calc(110px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);margin:0 -14px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;border-bottom:1px solid var(--border)}
.tb-row{display:flex;align-items:center;gap:8px;min-height:48px}
.brand{flex:1;min-width:0;line-height:1.1}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.brand .title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:999px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;padding:0}
.iconbtn.flat{border-color:transparent;background:transparent}
.iconbtn:active,.btn:active,.chip:active,.card-tap:active{transform:scale(.97)}
.iconbtn.on{color:var(--accent)}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--primary);font-weight:700;font-size:16px;min-height:var(--tap);padding:0 8px 0 0;flex-shrink:0}
.back .arr{font-size:24px;line-height:1}
.search{position:relative;margin-top:8px}
.search input{width:100%;height:52px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:0 48px 0 44px;font-size:17px}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:18px;pointer-events:none}
.search .clr{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--text-faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 14px;min-height:40px;font-size:14.5px;font-weight:600;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .n{font-size:12px;color:var(--text-faint);font-weight:700}
.chip.sel{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip.sel .n{color:inherit;opacity:.8}
.listhead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.listhead select{border:0;background:none;color:var(--primary);font-weight:700;font-size:14px;letter-spacing:0;text-transform:none;min-height:40px}
.jobs{display:flex;flex-direction:column;gap:10px}
.jobcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 4px 10px 10px;min-height:84px;box-shadow:var(--shadow)}
.jobcard.pinned{border-left:4px solid var(--accent)}
.thumb{width:60px;height:60px;border-radius:10px;background:var(--surface-2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-faint)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.jm{flex:1;min-width:0}
.jm .tool{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;line-height:1.05;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.jm .part{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.jm .sub{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.jright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.pill{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st-active{background:var(--primary-dim);color:var(--primary)}
.st-setup{background:var(--warn-dim);color:var(--warn)}
.st-hold{background:var(--hold-dim);color:var(--hold)}
.st-done{background:var(--good-dim);color:var(--good)}
.exbadge{font-family:'Barlow',sans-serif;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--accent-dim);color:var(--accent);border:1px dashed var(--accent);padding:1px 6px;border-radius:6px;text-transform:uppercase}
.star{width:44px;height:44px;border:0;background:none;font-size:22px;color:var(--text-faint);padding:0}
.star.on{color:var(--accent)}
.empty{text-align:center;color:var(--text-dim);padding:48px 16px}
.empty .big{font-size:40px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:64px;min-width:64px;padding:0 22px;border-radius:32px;border:0;background:var(--primary);color:var(--primary-ink);font-size:18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:45;display:flex;align-items:center;gap:8px}
.fab .plus{font-size:30px;line-height:1;margin-top:-2px}
.banner{display:flex;align-items:center;gap:10px;border-radius:var(--radius);padding:10px 12px;margin-top:10px;font-size:14px;font-weight:500;background:var(--surface-2);border:1px solid var(--border)}
.banner.warn{background:var(--warn-dim);border-color:transparent;color:var(--warn)}
.banner.info{background:var(--primary-dim);border-color:transparent;color:var(--primary)}
.banner .grow{flex:1}
.banner .btn{min-height:40px;padding:0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:12px;box-shadow:var(--shadow);overflow:hidden}
.card-bd{padding:12px}
.hdr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hdr-grid .full{grid-column:1/-1}
.fl{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:4px}
.inp{width:100%;min-height:var(--tap);border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:17px}
.inp.big{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;letter-spacing:.02em}
textarea.inp{resize:vertical;min-height:90px;line-height:1.4}
.inp:focus,.fv input:focus,.step textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:var(--tap);border:1px solid var(--border);background:var(--surface);border-radius:10px;font-weight:700;font-size:14.5px;color:var(--text-dim)}
.seg button.sel.active{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.seg button.sel.setup{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button.sel.hold{background:var(--hold);border-color:var(--hold);color:#fff}
.seg button.sel.done{background:var(--good);border-color:var(--good);color:#fff}
.sec-hd{display:flex;align-items:center;gap:6px;background:var(--primary-dim);padding:6px 6px 6px 12px;min-height:52px}
.sec-hd h2{margin:0;flex:1;min-width:0;font-size:19px;color:var(--primary);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-hd .meta{font-size:13px;font-weight:700;color:var(--primary)}
.sec-hd .inp{min-height:40px;font-weight:700;font-size:16px}
.smallbtn{min-height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:700;color:var(--primary);flex-shrink:0}
.smallbtn.danger{color:var(--danger)}
.frow{display:flex;align-items:center;gap:8px;padding:4px 12px;min-height:56px;border-top:1px solid var(--border)}
.frow:first-child{border-top:0}
.frow .lab{width:42%;flex-shrink:0;font-size:15px;color:var(--text-dim);font-weight:500;line-height:1.2}
.fv{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.fv input{flex:1;min-width:0;height:44px;border:1px solid transparent;background:var(--surface-2);border-radius:8px;padding:0 10px;font-size:18px;font-weight:700}
.fv .unit{font-size:14px;color:var(--text-faint);font-weight:600;min-width:28px}
.frow.edit .lab{width:auto;flex:1}
.frow.edit input.inp{min-height:44px;font-size:15px;padding:6px 8px}
.frow.edit .u{width:70px;flex-shrink:0}
.mv{display:flex;flex-direction:column}
.mv button{width:36px;height:24px;border:0;background:none;color:var(--text-faint);font-size:13px;padding:0}
.del{width:44px;height:44px;border:0;background:none;color:var(--danger);font-size:20px;flex-shrink:0;padding:0}
.addrow{padding:6px 8px 10px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:700;font-size:15px;min-height:var(--tap);padding:0 8px}
.step{display:flex;align-items:flex-start;gap:8px;padding:6px 8px 6px 6px;border-top:1px solid var(--border)}
.step:first-child{border-top:0}
.chk{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:transparent;padding:0}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.step .num{width:22px;flex-shrink:0;text-align:right;font-weight:800;color:var(--primary);padding-top:12px;font-size:14px}
.step textarea{flex:1;min-width:0;border:0;background:none;resize:none;overflow:hidden;font-size:16px;line-height:1.35;padding:11px 0;min-height:44px}
.step.done textarea{color:var(--text-faint);text-decoration:line-through}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.prog>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .2s}
.notes{width:100%;border:0;background:var(--surface-2);border-radius:10px;padding:12px;min-height:110px;font-size:16px;line-height:1.4;resize:vertical}
.photogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);padding:0;text-align:left}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:13px;font-weight:700;padding:18px 8px 6px;letter-spacing:.02em}
.ph .ord{position:absolute;left:6px;top:6px;background:rgba(8,20,36,.72);color:#fff;font-size:12px;font-weight:800;border-radius:99px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 7px}
/* arrange photos (mirrors the reference-sheet grid) */
.arr-intro{margin:10px 2px 0;font-size:14px;color:var(--text-dim)}
.arr-intro b{color:var(--text)}
.arr-grid{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding-bottom:8px}
.arr-page{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:800;white-space:nowrap}
.arr-page::before,.arr-page::after{content:"";flex:1;height:2px;background:var(--border)}
.arr-page.brk{color:var(--accent);margin-top:20px}
.arr-page.brk::before,.arr-page.brk::after{height:0;border-top:2px dashed var(--accent);background:none}
.arr-rows{display:flex;flex-direction:column;gap:8px}
.arr-row{display:flex;justify-content:center;gap:6px}
.arr-cell{width:calc((100% - 18px) / 4);flex-shrink:0;position:relative;border-radius:10px;border:1px solid var(--border);background:var(--surface);overflow:hidden;padding:0;cursor:grab;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow);transition:transform .2s}
.arr-cell img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;pointer-events:none;background:var(--surface-2);-webkit-user-drag:none}
.arr-num{position:absolute;left:4px;top:4px;min-width:32px;height:32px;border-radius:99px;background:var(--primary);color:var(--primary-ink);font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 7px;box-shadow:0 1px 5px rgba(0,0,0,.4);border:2px solid var(--surface)}
.arr-lab{font-size:11.5px;font-weight:700;line-height:1.15;padding:4px 5px 0;margin-bottom:5px;max-height:calc(2.3em + 4px);min-height:calc(2.3em + 4px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);overflow-wrap:anywhere}
.arr-lab.none{color:var(--text-faint);font-style:italic;font-weight:600}
.arr-cell.pressing{transform:scale(.94)}
.arr-cell.arr-ph{border:2px dashed var(--primary);background:var(--primary-dim);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--primary);font-weight:800;font-size:12px;cursor:grabbing}
.arr-cell.arr-ph .ph-box{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:24px}
.arr-cell.arr-ph .arr-lab{color:var(--primary);text-align:center;font-style:normal}
.arr-ghost{position:fixed;left:0;top:0;z-index:150;pointer-events:none;margin:0;cursor:grabbing;box-shadow:0 14px 34px rgba(0,0,0,.45);outline:3px solid var(--accent);transition:none;will-change:transform}
body.arr-dragging{cursor:grabbing}
.arr-cell.flash{animation:arrflash 1.4s ease-out}
@keyframes arrflash{0%,45%{outline:4px solid var(--accent);outline-offset:1px}100%{outline:4px solid transparent;outline-offset:1px}}
.arrbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.arrbar .btn{min-height:60px;border-radius:14px;font-size:16px;padding:0 8px}
.arrbar .btn:disabled{opacity:.4}
.arr-hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.arr-hd .thumb{width:96px;height:72px}
.arr-hd .pos{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--primary);line-height:1}
.arr-hd .pos small{font-family:'Barlow',sans-serif;font-size:13px;color:var(--text-dim);font-weight:600}
.arr-hd .lab{font-weight:700;font-size:15.5px;margin-top:3px;overflow-wrap:anywhere}
.arr-mv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.arr-mv .btn{min-height:58px;border-radius:14px;font-size:16px}
.arr-mv .btn:disabled{opacity:.35}
.arr-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.arr-nums button{min-height:58px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--primary);padding:0}
.arr-nums button.sel{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.arr-nums .pg{grid-column:1/-1;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:800;margin:4px 2px -2px}
.arr-nums .pg.brk{color:var(--accent)}
.trow{display:flex;align-items:center;gap:6px;padding:4px 8px;border-top:1px solid var(--border);min-height:56px}
.trow:first-child{border-top:0}
.trow .tn{width:22px;text-align:right;font-weight:800;color:var(--primary);font-size:14px;flex-shrink:0}
.trow input{height:44px;border:1px solid transparent;background:var(--surface-2);border-radius:8px;padding:0 10px;font-size:16px;min-width:0}
.trow input.td{flex:1;font-weight:600}
.trow input.tq{width:104px;flex-shrink:0;font-weight:700;text-align:center}
.thead{display:flex;gap:6px;padding:8px 8px 2px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.thead .c1{width:22px;text-align:right}.thead .c2{flex:1;padding-left:10px}.thead .c3{width:104px;text-align:center}
.step .bul{width:22px;flex-shrink:0;text-align:center;font-weight:900;color:var(--primary);padding-top:10px;font-size:18px}
.logoprev{height:64px;min-width:64px;max-width:200px;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff;padding:4px;color:#8492a0;font-size:12px}
.logoprev img{max-height:56px;max-width:190px;object-fit:contain}
.vmove{display:flex;align-items:center;gap:8px;padding:0 10px}
.vmove .btn{flex:1;min-height:44px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.btn{min-height:var(--tap);border-radius:999px;border:1px solid transparent;padding:0 18px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.1}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn.good{background:var(--good);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn.tall{min-height:58px;border-radius:14px;font-size:16.5px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 -4px 14px rgba(0,0,0,.06)}

var libP = {};
function loadScript(src, globalName){

  if(libP[src]) return libP[src];
  libP[src] = new Promise(function(res, rej){
    var s=document.createElement("script"); s.src=src; s.async=true;
    s.onload=function(){ window[globalName]? res(window[globalName]) : rej(new Error(globalName+" didn't load")); };

    document.head.appendChild(s);

}

      if(!lines.length && data.text) lines = data.text.split(/\n/).filter(function(t){ return t.trim(); }).map(function(t){ return {text:t, conf:(data.confidence||60)/100}; });

  var p = h.split("/").filter(Boolean);
  if(p[0]==="job" && p[1]) return {view: p[2]||"detail", id: decodeURIComponent(p[1])};
  if(p[0]==="templates") return {view:"templates"};
  if(p[0]==="settings") return {view:"settings"};

}

function onRoute(){
  var r = parseRoute();

  if(state.route.view==="arrange" && (r.view!=="arrange" || r.id!==state.route.id)) arrLeave();

function filteredJobs(){
  var q = state.search.toLowerCase().replace(/\s+/g," ").trim();
  var terms = q.split(" ").filter(Boolean);
  var jobs = state.jobs.filter(function(j){
    if(state.fStatus!=="all" && j.status!==state.fStatus) return false;
    if(state.fPress!=="all" && (j.press||"").trim()!==state.fPress) return false;
    return true;
  });
  if(terms.length){
    // exact phrase first ("press 3", "hot runner"); fall back to all-words match
    var hs = jobs.map(function(j){ return haystack(j).replace(/\s+/g," "); });
    var phrase = jobs.filter(function(j,i){ return hs[i].indexOf(q)>=0; });
    jobs = (terms.length>1 && phrase.length) ? phrase : jobs.filter(function(j,i){ return terms.every(function(t){ return hs[i].indexOf(t)>=0; }); });
  }
  var cmp = state.sort==="tool" ? function(a,b){ return (a.toolNumber||"~").localeCompare(b.toolNumber||"~", undefined, {numeric:true}); }
    : state.sort==="customer" ? function(a,b){ return (a.customer||"~").localeCompare(b.customer||"~"); }
    : function(a,b){ return (b.updatedAt||"").localeCompare(a.updatedAt||""); };
  jobs.sort(function(a,b){ if(!!a.pinned!==!!b.pinned) return a.pinned?-1:1; return cmp(a,b); });

function backupDue(){
  var real = state.jobs.filter(function(j){ return !j.example || j._touched; });
  if(!real.length) return 0;
  if(state.meta.backupSnooze && Date.now() < state.meta.backupSnooze) return 0;
  var ref = state.meta.lastBackupAt || real.reduce(function(m,j){ return j.createdAt<m? j.createdAt : m; }, nowIso());
  var days = Math.floor((Date.now()-new Date(ref).getTime())/DAY);
  return days>=14 ? days : 0;
}

var RS = {W:7.9, gap:0.06, lab:0.2, photoH:5.3, minPhotoH:2.9, contImgH:1.55, perCont:20, pageH:10.25};
function rsRows(n){ var rows=[]; if(!n) return rows; if(n<=4) return [n]; for(var i=0;i<n;i+=4) rows.push(Math.min(4,n-i)); return rows; }
function rsPhotoBlock(list, startIdx, budget, fixedImgH){
  var rows=rsRows(list.length); if(!rows.length) return {html:"", h:0};
  var w4=(RS.W-RS.gap*3)/4, single=list.length<=4;
  var widths = rows.map(function(c){ return single ? (RS.W-RS.gap*(c-1))/c : (c===4 ? w4 : Math.min((RS.W-RS.gap*(c-1))/c, w4*1.5)); });
  var ih = fixedImgH;
  if(!ih){ var share=(budget-RS.gap*(rows.length-1))/rows.length-RS.lab; ih=Math.min(share, Math.min.apply(null, widths)*0.95); }
  var k=0, html="";
  rows.forEach(function(c, ri){
    html += '<div class="rs-row">';
    for(var i=0;i<c;i++,k++){ var p=list[k];
      html += '<div class="rs-cell" style="width:'+widths[ri].toFixed(3)+'in"><div class="rs-lab">'+esc(p.label||("Photo "+(startIdx+k+1)))+'</div><div class="rs-ph"><img data-pid="'+esc(p.id)+'" alt="'+esc(p.label||"")+'"></div></div>';
    }
    html += '</div>';
  });
  var h = rows.length*(ih+RS.lab) + RS.gap*(rows.length-1);
  return {html:html, h:h};
}
function rsUnit(u){ return ({"s":"seconds","lb":"lbs"})[u] || u; }
function rsVal(f){
  if(!f) return ""; var v=String(f.value||"").trim(); if(!v) return "";
  if(!f.unit) return v;
  var m=v.match(/^(-?[\d.,]+)(.*)$/); var u=rsUnit(f.unit);

}

function fitSheet(){

  var p1=inner.querySelector(".rs-page.first"), ph=p1 && p1.querySelector(".rs-photos");

    var inch=96, design=parseFloat(ph.getAttribute("data-h"))*inch; ph.style.height=design+"px";
    var bot=p1.querySelector(".rs-bot"); bot.style.flexGrow="0";

    for(var i=0;i<kids.length;i++) sum+=kids[i].offsetHeight;

function fillSettingsStatus(){
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){
      var p = navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false);
      p.then(function(pers){ var el=$("storageInfo"); if(el) el.innerHTML = esc(fmtBytes(e.usage||0))+' used'+(pers?' · <span style="color:var(--good)">protected</span>':' · <span style="color:var(--warn)">may be cleared if phone is low on space</span>'); });
    });
  } else { var el=$("storageInfo"); if(el) el.textContent="n/a"; }
  ocrCached().then(function(ok){ var el=$("ocrStatus"); if(el) el.innerHTML = ok? '<span style="color:var(--good);font-weight:700">✓ Scanning engine is saved for offline use</span>' : 'Scanning engine not downloaded yet (downloads automatically on first scan).'; });
}
function ocrCached(){
  if(!window.caches) return Promise.resolve(false);
  return Promise.all(OCR_WARM_URLS.slice(0,4).map(function(u){ return caches.match(u).then(function(r){ return !!r; }); })).then(function(a){ return a.every(Boolean); }).catch(function(){ return false; });
}
function warmOcr(manual){
  if(!("serviceWorker" in navigator) || !navigator.serviceWorker.controller){ if(manual) showToast("Offline caching needs the installed/served app (not file://)."); return Promise.resolve(); }
  if(manual) setBusy("Downloading scanning engine…");
  return Promise.all(OCR_WARM_URLS.map(function(u){ return fetch(u, {mode:"cors"}).then(function(r){ return r.ok; }).catch(function(){ return false; }); })).then(function(res){
    var ok = res.every(Boolean); state.meta.ocrWarmAt = ok? nowIso() : state.meta.ocrWarmAt; saveMeta();
    if(manual){ setBusy(null); showToast(ok? "Scanning engine saved for offline ✓" : "Download incomplete — try again on Wi-Fi", {err:!ok}); if(state.route.view==="settings") fillSettingsStatus(); }
  });
}

function operators(){ var o={}; if(state.meta.operator) o[state.meta.operator]=1; state.jobs.forEach(function(j){ (j.runLog||[]).forEach(function(e){ if(e.operator) o[e.operator]=1; }); }); return Object.keys(o); }
function openModal(m){ state.modal=m; renderModal(); }
function closeModal(){ state.modal=null; renderModal(); }
function bindSwipe(){
  var el=$("vimg"); if(!el) return; var x0=null;
  el.addEventListener("touchstart", function(e){ if(e.touches.length===1) x0=e.touches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", function(e){ if(x0==null) return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>60) navPhoto(dx<0?1:-1); }, {passive:true});
}
function navPhoto(d){ var j=curJob(); if(!j||!state.modal) return; var i=state.modal.i+d; if(i<0||i>=j.photos.length) return; state.modal.i=i; renderModal(); }

function setBusy(text, opts){
  state.busy = text? Object.assign({text:text}, opts||{}) : null; renderBusy();
}
function renderBusy(){
  var b=state.busy, root=$("busyRoot");
  if(!b){ root.innerHTML=""; return; }
  var existing = $("busyText");
  if(existing && root.firstChild){ existing.textContent=b.text; var pg=$("busyProg"); if(pg) pg.style.width=(b.pct||0)+"%"; return; }
  root.innerHTML = '<div class="busy" role="status"><div class="row"><div class="spin"></div><div style="flex:1;font-weight:600" id="busyText">'+esc(b.text)+'</div>'+(b.cancel?'<button class="btn ghost" data-act="cancelScan">Stop</button>':'')+'</div><div class="prog" style="margin-top:10px"><i id="busyProg" style="width:'+(b.pct||0)+'%"></i></div></div>';
}
var toastTimer=null;
function showToast(text, opts){
  opts=opts||{}; state.toast={text:text, act:opts.act, actLabel:opts.actLabel, err:opts.err, arr:opts.arr};
  clearTimeout(toastTimer); renderToast();
  toastTimer=setTimeout(function(){ var t=state.toast; state.toast=null; renderToast(); if(t && opts.onExpire) opts.onExpire(); }, opts.ms || (opts.act? 7000 : 3200));
}
function renderToast(){
  var t=state.toast, root=$("toastRoot");
  root.innerHTML = t? '<div class="toast'+(t.err?' err':'')+'" role="status"><span>'+esc(t.text)+'</span>'+(t.act?'<button data-act="toastAct">'+esc(t.actLabel||"UNDO")+'</button>':'')+'</div>' : "";
}

  .then(function(){ setBusy(null); touch(j); saveJobs(); askPersist(); render(); if(ids.length){ state.photoQueue=ids.slice(1); openModal({type:"photoLabel", pid:ids[0], left:state.photoQueue.length}); } })

/* ---------- arrange photos (full screen, mirrors the reference-sheet grid) ---------- */
var VIEW_ORDER = PHOTO_PRESETS.slice(0,11); // template view order: mold A, B, sides, top, bottom, insert, profile, finished top/bottom/front edge
var arrDrag = null, arrJustDragged = 0;
function arrPageOf(i){ return i<12 ? 1 : 2+Math.floor((i-12)/RS.perCont); }
function arrPagesFor(n){ return 1+Math.ceil(Math.max(0,n-12)/RS.perCont); }
function arrSegments(n){ var segs=[], i=0; if(!n) return segs; segs.push([0, Math.min(12,n)]); i=12; while(i<n){ segs.push([i, Math.min(n, i+RS.perCont)]); i+=RS.perCont; } return segs; }
function arrImg(p){ var u=urlCache[p.id]; return '<img '+(u?'src="'+u+'" ':'')+'data-pid="'+esc(p.id)+'" alt="" draggable="false">'; }
// items: photo objects, with null = drop placeholder
function arrGridHtml(items){
  var n=items.length, h='';
  if(!n) return '<div class="empty"><div class="big">🖼️</div>No photos yet.<br>Add them from the job’s Photos section.</div>';
  arrSegments(n).forEach(function(seg, si){
    var a=seg[0], b=seg[1], pg=si+1;
    h += '<div class="arr-page'+(si?' brk':'')+'">'+(si? '✂ Page '+pg+' · photos '+(a+1)+'–'+b : 'Page 1'+(n>12? ' · photos 1–12' : ''))+'</div><div class="arr-rows">';
    var k=a;
    rsRows(b-a).forEach(function(c){
      h += '<div class="arr-row">';
      for(var x=0;x<c;x++,k++){
        var p=items[k];
        if(!p){ h += '<div class="arr-cell arr-ph arr-slot" data-slot="'+k+'"><div class="ph-box">⤓</div><span class="arr-num">'+(k+1)+'</span><div class="arr-lab">Drop here</div></div>'; continue; }
        var lab=String(p.label||"").trim();
        h += '<div class="arr-cell arr-slot'+(state.arrFlash===p.id?' flash':'')+'" role="button" tabindex="0" data-act="arrTap" data-id="'+esc(p.id)+'" data-slot="'+k+'" aria-label="Position '+(k+1)+': '+esc(lab||"Unlabeled photo")+'. Tap for options, press and hold to drag.">'+
          arrImg(p)+'<span class="arr-num">'+(k+1)+'</span><div class="arr-lab'+(lab?'':' none')+'">'+esc(lab||("Photo "+(k+1)))+'</div></div>';
      }
      h += '</div>';
    });
    h += '</div>';
  });
  return h;
}
function viewArrange(){
  var j=curJob(); if(!j) return viewList();
  var n=j.photos.length, pages=arrPagesFor(n), canUndo=arrCanUndo(j);
  var h = topbar('<button class="back" data-act="arrDone"><span class="arr">‹</span>Done</button>', "Arrange photos", jobTitle(j)+" · reference sheet order",
    '<button class="iconbtn" data-act="arrUndo" aria-label="Undo last change" title="Undo"'+(canUndo?'':' disabled style="opacity:.35"')+'>↶</button>');
  h += '<p class="arr-intro"><b>'+n+' photo'+(n===1?'':'s')+' · '+pages+' sheet page'+(pages>1?'s':'')+'.</b> Same order &amp; grid as the printed sheet. <b>Press &amp; hold</b> a photo to drag it, or <b>tap</b> it for move, label, replace, rotate &amp; delete.</p>';
  h += '<div class="arr-grid" id="arrGrid">'+arrGridHtml(j.photos)+'</div>';
  h += '<div class="arrbar no-print"><button class="btn ghost" data-act="arrUndo"'+(canUndo?'':' disabled')+'>↶ Undo</button><button class="btn ghost" data-act="arrSort"'+(n>1?'':' disabled')+'>⇅ Preset order</button><button class="btn primary" data-act="arrDone">✓ Done</button></div>';
  return h;
}
function arrCanUndo(j){ return state.arrUndo.some(function(u){ return u.jobId===j.id; }); }
function arrPushUndo(j, label){ state.arrUndo.push({jobId:j.id, label:label, photos:clone(j.photos)}); if(state.arrUndo.length>40) state.arrUndo.shift(); }
function arrToast(text){ showToast(text, {act:arrUndo, actLabel:"UNDO", arr:true}); }
function arrRerender(){ var y=window.scrollY; render(); window.scrollTo(0,y); }
function arrFlashTo(pid){
  var el=document.querySelector('.arr-cell[data-id="'+pid+'"]'); state.arrFlash=null; if(!el) return;
  var r=el.getBoundingClientRect(); if(r.top<90 || r.bottom>window.innerHeight-100) el.scrollIntoView({block:"center"});
}
// apply one arrange change: snapshot for undo, mutate, save immediately, re-render
function arrApply(label, fn, flash){
  var j=curJob(); if(!j) return;
  arrPushUndo(j, label);
  if(fn(j)===false){ state.arrUndo.pop(); return; }
  touch(j); saveJobs();
  state.arrFlash = flash||null; arrRerender(); if(flash) arrFlashTo(flash);
  arrToast(label);
}
function arrUndo(){
  var u=null; for(var k=state.arrUndo.length-1;k>=0;k--){ if(state.arrUndo[k].jobId===state.route.id){ u=state.arrUndo.splice(k,1)[0]; break; } }
  if(!u){ showToast("Nothing to undo"); return; }
  var j=getJob(u.jobId); if(!j) return;
  j.photos=u.photos; touch(j); saveJobs();
  if(state.modal && state.modal.type && state.modal.type.indexOf("arr")===0) state.modal=null;
  arrRerender(); showToast("Undone: "+u.label, {arr:true});
}
function photoReferenced(id){
  if(state.jobs.some(function(j){ return (j.photos||[]).some(function(q){ return q.id===id; }); })) return true;
  if(state.pendingDelete && (state.pendingDelete.job.photos||[]).some(function(q){ return q.id===id; })) return true;
  return state.arrUndo.some(function(u){ return u.photos.some(function(q){ return q.id===id; }); });
}
// leaving the arrange screen: drop undo history and delete pictures that were replaced/rotated/deleted
function arrLeave(){
  if(arrDrag) arrAbort();
  var ids={}; state.arrUndo.forEach(function(u){ u.photos.forEach(function(q){ ids[q.id]=1; }); });
  state.arrUndo=[]; state.arrPushed=false; state.arrFlash=null;
  Object.keys(ids).forEach(function(id){ if(!photoReferenced(id)) delPhoto(id); });
  if(state.toast && state.toast.arr){ state.toast=null; clearTimeout(toastTimer); renderToast(); }
}
function arrMovePid(j, pid, to){ var from=j.photos.findIndex(function(p){ return p.id===pid; }); if(from<0) return false; to=Math.max(0, Math.min(j.photos.length-1, to)); if(to===from) return false; var x=j.photos.splice(from,1)[0]; j.photos.splice(to,0,x); }
function arrIdx(j, pid){ return j.photos.findIndex(function(p){ return p.id===pid; }); }
function presetRank(label){
  var k=normKey(label); if(!k) return 99;
  for(var i=0;i<VIEW_ORDER.length;i++){ if(normKey(VIEW_ORDER[i])===k) return i; }
  for(var m=0;m<VIEW_ORDER.length;m++){ var pk=normKey(VIEW_ORDER[m]); if(k.indexOf(pk)===0 || (k.length>=8 && pk.indexOf(k)===0)) return m; }
  return 99;
}
function presetSorted(photos){ return photos.map(function(p,i){ return {p:p, i:i, r:presetRank(p.label)}; }).sort(function(a,b){ return a.r-b.r || a.i-b.i; }).map(function(x){ return x.p; }); }

/* modal sheets for the arrange screen */
function arrModalHtml(j, m){
  var i=arrIdx(j, m.pid), n=j.photos.length; if(i<0) return null;
  var p=j.photos[i], lab=String(p.label||"").trim()||("Photo "+(i+1));

  if(m.type==="arrPhoto"){
    return hd+'<div class="arr-mv">'+
      '<button class="btn ghost" data-act="arrMove" data-d="first"'+(i?'':' disabled')+'>⇤ Move first</button>'+
      '<button class="btn ghost" data-act="arrMove" data-d="last"'+(i<n-1?'':' disabled')+'>Move last ⇥</button>'+
      '<button class="btn ghost" data-act="arrMove" data-d="-1"'+(i?'':' disabled')+'>◀ Earlier</button>'+
      '<button class="btn ghost" data-act="arrMove" data-d="1"'+(i<n-1?'':' disabled')+'>Later ▶</button></div>'+
      '<div class="menu">'+
      (n>1? '<button data-act="arrMoveTo"><span class="ic">🔢</span><span>Move to position…<small>Pick its spot 1–'+n+' on the sheet</small></span></button>' : '')+
      '<button data-act="arrLabel"><span class="ic">🏷</span><span>Change label<small>Template views or your own text</small></span></button>'+
      '<button data-act="arrReplace"><span class="ic">🔄</span><span>Replace picture<small>Camera, gallery or Drive — keeps label &amp; position</small></span></button>'+
      '<button data-act="arrRotate"><span class="ic">⟳</span><span>Rotate 90°<small>Clockwise, saved right away</small></span></button>'+
      '<button data-act="arrView"><span class="ic">🔍</span><span>View full size</span></button>'+
      '<button data-act="arrDelete" class="danger"><span class="ic">🗑</span><span>Delete photo<small>You can undo</small></span></button>'+
      '</div><div class="actions"><button class="btn ghost" data-act="closeModal">Close</button></div>';
  }
  if(m.type==="arrMoveTo"){
    var nums='';
    for(var k=0;k<n;k++){
      if(k===0 && n>12) nums+='<div class="pg">Page 1</div>';
      if(k>=12 && (k-12)%RS.perCont===0) nums+='<div class="pg brk">Page '+arrPageOf(k)+'</div>';
      nums+='<button class="'+(k===i?'sel':'')+'" data-act="arrMoveToGo" data-v="'+(k+1)+'" aria-label="Move to position '+(k+1)+'"'+(k===i?' aria-current="true"':'')+'>'+(k+1)+'</button>';
    }
    return '<h3>Move to position</h3>'+hd+'<p class="sub">Tap the new spot. Positions match the numbered grid on the printed sheet.</p><div class="arr-nums">'+nums+'</div>'+
      '<div class="actions"><button class="btn ghost" data-act="arrBack">‹ Back</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>';
  }
  if(m.type==="arrReplace"){
    return '<h3>Replace picture</h3>'+hd+'<p class="sub">The new picture keeps this label and position #'+(i+1)+'.</p><div class="menu">'+
      '<button data-act="arrReplacePick" data-kind="cam"><span class="ic">📷</span><span>Take new photo</span></button>'+
      '<button data-act="arrReplacePick" data-kind="lib"><span class="ic">🖼️</span><span>Choose from gallery</span></button>'+
      '<button data-act="arrReplacePick" data-kind="files"><span class="ic">📁</span><span>From Google Drive / Files</span></button>'+
      '</div><div class="actions"><button class="btn ghost" data-act="arrBack">‹ Back</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>';
  }
  return null;
}

/* actions */
ACT.arrangeOpen = function(){ var j=curJob(); if(!j) return; state.arrFrom = state.route.view==="print" ? "print" : "detail"; state.modal=null; state.arrPushed=true; go("#/job/"+j.id+"/arrange"); };

ACT.arrReplace = function(){ openModal({type:"arrReplace", pid:state.modal.pid}); };
ACT.arrReplacePick = function(t){
  var kind=t.getAttribute("data-kind"), inp=$("inReplace");
  state.arrReplacePid = state.modal.pid; closeModal();
  if(kind==="cam") inp.setAttribute("capture","environment"); else inp.removeAttribute("capture");
  inp.setAttribute("accept", kind==="files" ? "image/*,application/pdf,.jpg,.jpeg,.png,.webp,.gif" : "image/*");

function arrReplaceFile(f){
  var pid=state.arrReplacePid, j=curJob(); state.arrReplacePid=null;
  if(!j || !pid || arrIdx(j,pid)<0) return;
  if(!(/^image\//.test(f.type) || /\.(jpe?g|png|webp|gif)$/i.test(f.name||""))){ showToast("That isn’t a picture — choose a JPG/PNG photo", {err:true}); return; }
  setBusy("Replacing picture…");
  compressPhoto(f).then(function(r){ var id=uid(); return putPhoto(id, r.blob).then(function(){
    setBusy(null);
    arrApply("Picture replaced", function(j){ var i=arrIdx(j,pid); if(i<0) return false; var o=j.photos[i]; j.photos[i]={id:id, label:o.label, addedAt:o.addedAt||nowIso(), replacedAt:nowIso(), bytes:r.blob.size, w:r.w, h:r.h}; }, id);
  }); }).catch(function(e){ setBusy(null); showToast("Replace failed: "+(e.message||e), {err:true}); });
}
function rotateBlob(blob){
  return loadImage(blob).then(function(im){
    var w=im.naturalWidth, h=im.naturalHeight, s=Math.min(1, 1280/Math.max(w,h)), W=Math.round(w*s), H=Math.round(h*s);
    var c=document.createElement("canvas"); c.width=H; c.height=W;
    var g=c.getContext("2d"); g.translate(H,0); g.rotate(Math.PI/2); g.drawImage(im,0,0,W,H);
    return canvasBlob(c,"image/jpeg",0.72).then(function(b){ return {blob:b, w:c.width, h:c.height}; });
  });
}
ACT.arrRotate = function(){
  var pid=state.modal.pid; if(state.arrBusy) return; state.arrBusy=true;
  setBusy("Rotating…");
  getPhoto(pid).then(function(b){ if(!b) throw new Error("picture not found"); return rotateBlob(b); }).then(function(r){ var id=uid(); return putPhoto(id, r.blob).then(function(){
    setBusy(null); state.arrBusy=false;
    if(state.modal && state.modal.type==="arrPhoto" && state.modal.pid===pid) state.modal.pid=id; // keep the sheet open on the rotated picture
    arrApply("Rotated 90°", function(j){ var i=arrIdx(j,pid); if(i<0) return false; var o=j.photos[i]; j.photos[i]=Object.assign({}, o, {id:id, bytes:r.blob.size, w:r.w, h:r.h, rotatedAt:nowIso()}); }, id);
  }); }).catch(function(e){ setBusy(null); state.arrBusy=false; showToast("Rotate failed: "+(e.message||e), {err:true}); });
};
ACT.arrView = function(){ var j=curJob(), i=arrIdx(j, state.modal.pid); if(i>=0) openModal({type:"viewer", i:i}); };
ACT.arrDelete = function(){ var pid=state.modal.pid; state.modal=null; renderModal(); arrApply("Photo deleted", function(j){ var i=arrIdx(j,pid); if(i<0) return false; j.photos.splice(i,1); }); };
ACT.arrSort = function(){
  var j=curJob(); if(!j || j.photos.length<2) return;
  var sorted=presetSorted(j.photos);
  if(sorted.every(function(p,i){ return p===j.photos[i]; })){ showToast(j.photos.some(function(p){ return presetRank(p.label)<99; }) ? "Already in preset order" : "No template view labels to sort by — label photos first"); return; }
  arrApply("Sorted by template view order", function(j){ j.photos=presetSorted(j.photos); });
};

/* drag & drop: pointer events (touch = press-and-hold 250 ms to pick up; mouse = drag) */
function arrBind(){
  var g=$("arrGrid"); if(!g) return;
  g.addEventListener("pointerdown", arrDown);
  g.addEventListener("pointermove", arrMove);
  g.addEventListener("pointerup", arrUp);
  g.addEventListener("pointercancel", arrCancelEv);
  g.addEventListener("lostpointercapture", function(e){ if(arrDrag && arrDrag.active && e.pointerId===arrDrag.pointerId) arrDrop(); });
  g.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  g.addEventListener("dragstart", function(e){ e.preventDefault(); });
  // once a photo is picked up, stop the page from panning (touch-action stays auto so normal swipes scroll)
  g.addEventListener("touchmove", function(e){ if(arrDrag && arrDrag.active && e.cancelable) e.preventDefault(); }, {passive:false});
}
function arrDown(e){
  arrJustDragged=0; // a new press: any click from here on is a real tap
  if(arrDrag || state.modal) return;
  if(e.pointerType==="mouse" && e.button!==0) return;
  var cell=e.target.closest(".arr-cell[data-id]"); if(!cell) return;
  arrDrag={pid:cell.getAttribute("data-id"), pointerId:e.pointerId, type:e.pointerType, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, active:false, cell:cell};
  if(e.pointerType!=="mouse"){ cell.classList.add("pressing"); arrDrag.timer=setTimeout(arrPick, 250); }
}
function arrMove(e){
  var d=arrDrag; if(!d || e.pointerId!==d.pointerId) return;
  d.x=e.clientX; d.y=e.clientY;
  if(!d.active){
    var dist=Math.hypot(d.x-d.x0, d.y-d.y0);
    if(d.type==="mouse"){ if(dist>6) arrPick(); }
    else if(dist>10) arrReset(); // finger moved before the hold: it's a scroll, let the browser have it
    return;
  }
  e.preventDefault(); arrGhostPos(); arrHit();
}
function arrUp(e){
  var d=arrDrag; if(!d || e.pointerId!==d.pointerId) return;
  if(d.active) arrDrop(); else arrReset();
}
function arrCancelEv(e){ var d=arrDrag; if(!d || e.pointerId!==d.pointerId) return; if(d.active) arrDrop(); else arrReset(); }
function arrReset(){ if(!arrDrag) return; clearTimeout(arrDrag.timer); if(arrDrag.cell) arrDrag.cell.classList.remove("pressing"); arrDrag=null; }
function arrPick(){
  var d=arrDrag, j=curJob(); if(!d || d.active || !j) return;
  clearTimeout(d.timer);
  var from=arrIdx(j, d.pid); if(from<0){ arrReset(); return; }
  d.cell.classList.remove("pressing");
  var r=d.cell.getBoundingClientRect();
  d.active=true; d.from=from; d.target=from; d.offX=d.x0-r.left; d.offY=d.y0-r.top;
  d.list=j.photos.filter(function(p){ return p.id!==d.pid; });
  var gh=d.cell.cloneNode(true); gh.classList.add("arr-ghost"); gh.classList.remove("flash"); gh.removeAttribute("data-act"); gh.removeAttribute("data-slot"); gh.classList.remove("arr-slot"); gh.removeAttribute("tabindex"); gh.setAttribute("aria-hidden","true");
  gh.style.width=r.width+"px"; document.body.appendChild(gh); d.ghost=gh;
  // keep the touched node attached (hidden) so its touchmove events still bubble to the grid's non-passive listener
  d.cell.classList.remove("arr-slot"); d.cell.removeAttribute("data-act"); d.cell.style.display="none";
  try{ $("arrGrid").setPointerCapture(d.pointerId); }catch(err){}
  document.body.classList.add("arr-dragging");
  if(navigator.vibrate) try{ navigator.vibrate(20); }catch(err){}
  arrRenderPreview(); arrGhostPos();
  d.raf=requestAnimationFrame(arrAutoScroll);
}
function arrGhostPos(){ var d=arrDrag; if(!d || !d.ghost) return; var lift = d.type==="mouse" ? 0 : 56; /* float above the finger so the drop spot stays visible */ d.ghost.style.transform="translate("+(d.x-d.offX)+"px,"+(d.y-d.offY-lift)+"px) scale(1.08) rotate(-1.5deg)"; }
function arrRenderPreview(){
  var d=arrDrag, g=$("arrGrid"); if(!d || !g) return;
  var items=d.list.slice(); items.splice(d.target, 0, null);
  g.innerHTML=arrGridHtml(items); g.appendChild(d.cell); hydratePhotos(g);
  var sy=window.scrollY, sx=window.scrollX;
  d.slots=Array.prototype.map.call(g.querySelectorAll(".arr-slot"), function(el){ var b=el.getBoundingClientRect(); return {l:b.left+sx, r:b.right+sx, t:b.top+sy, b:b.bottom+sy}; });
}
function arrHit(){
  var d=arrDrag; if(!d || !d.active || !d.slots || !d.slots.length) return;
  var x=d.x+window.scrollX, y=d.y+window.scrollY, s=d.slots, t=-1;
  for(var k=0;k<s.length;k++){ if(x>=s[k].l-3 && x<=s[k].r+3 && y>=s[k].t-4 && y<=s[k].b+4){ t=k; break; } }
  if(t<0){ var last=s[s.length-1]; if(y>last.b) t=s.length-1; else if(y<s[0].t) t=0; }
  if(t>=0 && t!==d.target){ d.target=t; arrRenderPreview(); if(navigator.vibrate) try{ navigator.vibrate(6); }catch(err){} }
}
function arrAutoScroll(){
  var d=arrDrag; if(!d || !d.active) return;
  var H=window.innerHeight, top=110, bot=H-115, v=0;
  if(d.y<top) v=-Math.min(20, Math.ceil((top-d.y)/5)); else if(d.y>bot) v=Math.min(20, Math.ceil((d.y-bot)/5));
  if(v){ var y0=window.scrollY; window.scrollBy(0, v); if(window.scrollY!==y0) arrHit(); }
  d.raf=requestAnimationFrame(arrAutoScroll);
}
function arrEndCommon(){ var d=arrDrag; arrDrag=null; if(!d) return null; clearTimeout(d.timer); cancelAnimationFrame(d.raf); if(d.ghost) d.ghost.remove(); document.body.classList.remove("arr-dragging"); try{ $("arrGrid").releasePointerCapture(d.pointerId); }catch(err){} return d; }
function arrDrop(){
  var d=arrEndCommon(); if(!d) return; arrJustDragged=Date.now();
  if(d.target!==d.from) arrApply("Moved to #"+(d.target+1), function(j){ return arrMovePid(j, d.pid, d.target); }, d.pid);
  else { var g=$("arrGrid"), j=curJob(); if(g && j){ g.innerHTML=arrGridHtml(j.photos); hydratePhotos(g); } }
}
function arrAbort(){ var d=arrEndCommon(); if(!d) return; var g=$("arrGrid"), j=curJob(); if(g && j){ g.innerHTML=arrGridHtml(j.photos); hydratePhotos(g); } }

/* backup */
function buildBackup(jobs, full){
  var photos={}, ids=[]; jobs.forEach(function(j){ (j.photos||[]).forEach(function(p){ ids.push(p.id); }); });
  setBusy("Packing "+ids.length+" photo(s)…");
  return ids.reduce(function(p,id){ return p.then(function(){ return getPhoto(id).then(function(b){ if(b) return blobToDataUrl(b).then(function(u){ photos[id]=u; }); }); }); }, Promise.resolve()).then(function(){
    setBusy(null);
    var o = {app:"tooling-job-log", format:2, schema:SCHEMA, kind: full?"full":"jobs", exportedAt:nowIso(), jobs:clone(jobs), templates: full? clone(state.templates) : [], photos:photos};
    if(full && state.meta.brand) o.brand = clone(state.meta.brand);
    return o;
  }).catch(function(e){ setBusy(null); throw e; });
}
function saveOrShare(obj, name, share){
  var blob = new Blob([JSON.stringify(obj)], {type:"application/json"});
  var markDone = function(){ if(obj.kind==="full"){ state.meta.lastBackupAt=nowIso(); state.meta.backupSnooze=0; saveMeta(); render(); } };
  if(share){
    var file; try{ file = new File([blob], name, {type:"application/json"}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      return navigator.share({files:[file], title:"Tooling Job Log backup", text:name}).then(function(){ markDone(); showToast("Backup shared ✓"); }).catch(function(err){ if(err && err.name==="AbortError") return; download(blob,name); markDone(); });
    }
    showToast("Sharing files isn’t supported here — downloading instead");
  }
  download(blob, name); markDone(); showToast("Saved "+name+" to Downloads");
  return Promise.resolve();
}
function download(blob, name){ var u=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 4000); }
ACT.backupShare = function(){ buildBackup(state.jobs, true).then(function(o){ saveOrShare(o, "job-log-backup-"+todayStr()+".json", true); }); };
ACT.backupDownload = function(){ buildBackup(state.jobs, true).then(function(o){ saveOrShare(o, "job-log-backup-"+todayStr()+".json", false); }); };

function importFile(file){
  setBusy("Reading backup…");
  file.text().then(function(txt){
    var o = JSON.parse(txt);
    if(!o || o.app!=="tooling-job-log" || !Array.isArray(o.jobs)) throw new Error("That file isn't a Tooling Job Log backup.");
    return mergeBackup(o);
  }).then(function(r){
    setBusy(null); render(); askPersist();
    openModal({type:"info", title:"Import complete", html:'<dl class="kvlist"><dt>New jobs added</dt><dd>'+r.added+'</dd><dt>Jobs updated (newer copy)</dt><dd>'+r.updated+'</dd><dt>Skipped (yours is newer/same)</dt><dd>'+r.skipped+'</dd><dt>Templates added</dt><dd>'+r.tpl+'</dd><dt>Photos restored</dt><dd>'+r.photos+'</dd></dl>'});
  }).catch(function(e){ setBusy(null); showToast("Import failed: "+(e.message||e), {err:true}); });
}
function mergeBackup(o){
  var r={added:0, updated:0, skipped:0, tpl:0, photos:0}, needPhotos=[];
  if(o.jobs.length){ // restoring onto a phone that only has the untouched sample data: drop the samples
    state.jobs.filter(function(j){ return j.example && !j._touched && !o.jobs.some(function(x){ return x.id===j.id; }); }).forEach(function(j){ (j.photos||[]).forEach(function(p){ delPhoto(p.id); }); });
    state.jobs = state.jobs.filter(function(j){ return !(j.example && !j._touched) || o.jobs.some(function(x){ return x.id===j.id; }); });
    if((o.templates||[]).some(function(t){ return t.example; })) state.templates = state.templates.filter(function(t){ return !t.example; });
  }
  o.jobs.forEach(function(inc){
    inc = normalizeJob(inc);
    var ex = getJob(inc.id);
    if(!ex){ state.jobs.push(inc); r.added++; needPhotos=needPhotos.concat(inc.photos); }
    else if((inc.updatedAt||"") > (ex.updatedAt||"")){ state.jobs[state.jobs.indexOf(ex)] = inc; r.updated++; needPhotos=needPhotos.concat(inc.photos); }
    else r.skipped++;
  });
  (o.templates||[]).forEach(function(t){ if(t && t.id && !state.templates.some(function(x){ return x.id===t.id; })){ state.templates.push(t); r.tpl++; } });
  if(o.brand && typeof o.brand==="object" && !(state.meta.brand && Object.keys(state.meta.brand).length)){ state.meta.brand=o.brand; saveMeta(); }
  saveJobs(); saveTemplates();
  var ph=o.photos||{};
  return needPhotos.reduce(function(p, meta){ return p.then(function(){ var u=ph[meta.id]; if(!u) return; return dataUrlToBlob(u).then(function(b){ revokeUrl(meta.id); return putPhoto(meta.id, b); }).then(function(){ r.photos++; }); }); }, Promise.resolve()).then(function(){ return r; });
}

function scanJob(){ var t=state.scanTarget; if(!t) return null; return t.newJob || getJob(t.jobId); }

  finishScan([{lines:lines, kind:"paste"}], "Pasted text · "+lines.filter(function(l){ return l.text.trim(); }).length+" lines"); };
ACT.cancelScan = function(){ state.scanCancelled=true; setBusy(null); if(tessWorkerP){ tessWorkerP.then(function(w){ w.terminate(); }).catch(function(){}); tessWorkerP=null; } showToast("Scan stopped"); };
function checkCancel(){ if(state.scanCancelled) throw {cancelled:true}; }
function runScanFiles(files){
  var list = Array.prototype.slice.call(files); if(!list.length) return;
  state.scanCancelled=false; var pages=[], total=0;
  setBusy("Preparing…", {cancel:true, pct:2});
  ocrProgressCb = function(m){
    if(!state.busy) return;
    var map={"loading tesseract core":"Loading OCR engine…","loading language traineddata":"Loading English data…","initializing api":"Starting OCR…","recognizing text":"Reading text"};
    var label = map[m.status]; if(!label) return;
    state.busy.text = label + (m.status==="recognizing text" && state.busy.page? " — page "+state.busy.page+(state.busy.pages>1?" of "+state.busy.pages:"") : "") + (m.progress? " "+Math.round(m.progress*100)+"%" : "");
    if(m.status==="recognizing text") state.busy.pct = Math.round(((state.busy.page-1) + (m.progress||0)) / Math.max(1,state.busy.pages) * 100);
    renderBusy();
  };
  var seq = Promise.resolve();
  list.forEach(function(file){
    seq = seq.then(function(){ checkCancel();
      if(file.type==="application/pdf" || /\.pdf$/i.test(file.name||"")){
        return file.arrayBuffer().then(function(buf){ return pdfLib().then(function(lib){ return lib.getDocument({data:new Uint8Array(buf)}).promise; }); }).then(function(doc){
          var n=Math.min(doc.numPages, 15); var ps=Promise.resolve();
          for(var i=1;i<=n;i++) (function(i){ ps = ps.then(function(){ checkCancel(); return doc.getPage(i).then(function(page){
            return pdfTextLines(page).then(function(lines){
              var chars = lines.reduce(function(a,l){ return a+l.text.trim().length; }, 0);
              if(chars>=25){ pages.push({lines:lines, kind:"pdf-text"}); state.busy && (state.busy.text="Reading PDF text — page "+i+" of "+n, state.busy.pct=Math.round(i/n*100)); renderBusy(); return; }
              var vp=page.getViewport({scale:2.2}); var c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
              if(state.busy){ state.busy.text="Rendering PDF page "+i+" of "+n+"…"; renderBusy(); }
              return page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise.then(function(){ return prepForOcr(c); }).then(function(pc){ checkCancel(); if(state.busy){ state.busy.page=i; state.busy.pages=n; } return ocrCanvas(pc, "PDF p"+i); }).then(function(r){ pages.push(r); });
            });
          }); }); })(i);
          total+=n;
          return ps.then(function(){ if(doc.numPages>15) showToast("Read the first 15 of "+doc.numPages+" pages"); });
        });
      }
      total++;
      return prepForOcr(file).then(function(c){ checkCancel(); if(state.busy){ state.busy.page=(state.busy.page||0)+1; state.busy.pages=list.length; state.busy.text="Starting OCR…"; renderBusy(); } return ocrCanvas(c, file.name); }).then(function(r){ pages.push(r); });
    });
  });
  seq.then(function(){ checkCancel();
    var kinds = pages.map(function(p){ return p.kind; });
    var ocrP = pages.filter(function(p){ return p.kind==="ocr"; });
    var avg = ocrP.length? Math.round(ocrP.reduce(function(a,p){ return a+p.conf; },0)/ocrP.length*100) : null;
    var summary = pages.length+" page"+(pages.length>1?"s":"")+" · "+(kinds.indexOf("pdf-text")>=0? "PDF text layer" + (ocrP.length?" + OCR":"") : "OCR")+(avg!=null? " · avg OCR confidence "+avg+"%" : "");
    finishScan(pages, summary);
  }).catch(function(e){
    setBusy(null); ocrProgressCb=null;
    if(e && e.cancelled) return;
    console.warn(e); showToast((e && e.message) || "Scan failed — try Paste text", {err:true, ms:6000});
  });
}
function finishScan(pages, summary){
  setBusy(null); ocrProgressCb=null;
  var job = scanJob(); if(!job){ showToast("Job not found", {err:true}); return; }
  var lines=[]; pages.forEach(function(p){ lines = lines.concat(p.lines); });
  var parsed = parseLines(lines, job, 0.9);
  var items = buildReview(job, parsed);
  openModal({type:"review", items:items, raw:lines.map(function(l){ return l.text; }).join("\n"), summary:summary+" · "+items.length+" value"+(items.length===1?"":"s")+" found"});
}

  var t=e.target;
  if(e.key==="Enter" && t.classList && t.classList.contains("jobcard")){ ACT.openJob(t); return; }
  if((e.key==="Enter"||e.key===" ") && t.classList && t.classList.contains("arr-cell") && t.hasAttribute("data-id")){ e.preventDefault(); ACT.arrTap(t); return; }
  if(e.key==="Enter" && t.hasAttribute && t.hasAttribute("data-fval")){
    e.preventDefault(); var all=Array.prototype.slice.call(document.querySelectorAll("[data-fval]")); var nx=all[all.indexOf(t)+1]; if(nx){ nx.focus(); nx.select && nx.select(); } else t.blur();
  }
});
document.addEventListener("focusin", function(e){ var t=e.target; if(t.hasAttribute && (t.hasAttribute("data-fval")||t.getAttribute("data-hdr")==="press") && t.dataset.orig==null) t.dataset.orig=t.value; });
document.addEventListener("input", function(e){
  var t=e.target, j=curJob();
  if(t.id==="searchInput"){ state.search=t.value; $("jobList").innerHTML=jobListHtml(filteredJobs()); hydratePhotos($("jobList")); return; }
  if(t.hasAttribute("data-rvval")){ state.modal.items[+t.getAttribute("data-rvval")].value=t.value; return; }
  if(t.hasAttribute("data-rvunit")){ state.modal.items[+t.getAttribute("data-rvunit")].unit=t.value; return; }
  if(t.hasAttribute("data-meta")){ state.meta[t.getAttribute("data-meta")]=t.value.trim(); saveMeta(); return; }
  if(t.hasAttribute("data-brand")){ state.meta.brand=state.meta.brand||{}; state.meta.brand[t.getAttribute("data-brand")]=t.value; saveMeta(); return; }
  if(!j) return;
  if(t.hasAttribute("data-auto")) autosize(t);
  var s = t.getAttribute("data-sid") ? secById(j, t.getAttribute("data-sid")) : null, f;
  if(t.hasAttribute("data-hdr")){ j[t.getAttribute("data-hdr")]=t.value; }
  else if(t.hasAttribute("data-fval")){ f=s.fields.find(function(x){ return x.id===t.getAttribute("data-fval"); }); if(f) f.value=t.value; }
  else if(t.hasAttribute("data-flabel")){ f=s.fields.find(function(x){ return x.id===t.getAttribute("data-flabel"); }); if(f) f.label=t.value; }
  else if(t.hasAttribute("data-funit")){ f=s.fields.find(function(x){ return x.id===t.getAttribute("data-funit"); }); if(f) f.unit=t.value.trim(); }
  else if(t.hasAttribute("data-itext")){ var it=s.items.find(function(x){ return x.id===t.getAttribute("data-itext"); }); if(it) it.text=t.value; }
  else if(t.hasAttribute("data-notes")){ s.text=t.value; }
  else if(t.hasAttribute("data-tdesc")){ var r1=s.rows.find(function(x){ return x.id===t.getAttribute("data-tdesc"); }); if(r1) r1.desc=t.value; }
  else if(t.hasAttribute("data-tqty")){ var r2=s.rows.find(function(x){ return x.id===t.getAttribute("data-tqty"); }); if(r2) r2.qty=t.value; }
  else if(t.hasAttribute("data-sectitle")){ var sec=secById(j,t.getAttribute("data-sectitle")); if(sec) sec.title=t.value; }
  else return;
  touch(j); saveJobsSoon();
});
document.addEventListener("change", function(e){
  var t=e.target, j=curJob();
  if(t.id==="sortSel"){ state.sort=t.value; $("jobList").innerHTML=jobListHtml(filteredJobs()); hydratePhotos($("jobList")); return; }
  if(t.hasAttribute("data-rvchk")){ state.modal.items[+t.getAttribute("data-rvchk")].selected=t.checked; return; }
  if(!j) return;
  if(t.dataset.orig!=null && t.dataset.orig!==t.value){
    var orig=t.dataset.orig;
    if(orig.trim()){
      if(t.hasAttribute("data-fval")){ var s=secById(j,t.getAttribute("data-sid")); var f=s&&s.fields.find(function(x){ return x.id===t.getAttribute("data-fval"); }); if(f) recordChange(j, f.label, orig, t.value, f.unit); }
      else recordChange(j, "Press", orig, t.value, "");
    }
    delete t.dataset.orig; saveJobs();
    if($("pendingBox")) $("pendingBox").innerHTML = pendingHtml(j);
  } else if(t.dataset.orig!=null) delete t.dataset.orig;
  if(t.hasAttribute("data-hdr") || t.hasAttribute("data-flabel") || t.hasAttribute("data-funit") || t.hasAttribute("data-sectitle")) saveJobs();
});
$("inPhotoCam").addEventListener("change", function(){ addPhotos(this.files); this.value=""; });
$("inPhotoLib").addEventListener("change", function(){ addPhotos(this.files); this.value=""; });
$("inPhotoFiles").addEventListener("change", function(){ var all=Array.prototype.slice.call(this.files); this.value=""; var imgs=all.filter(function(f){ return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif)$/i.test(f.name||""); }); if(imgs.length<all.length) showToast("Skipped "+(all.length-imgs.length)+" non-image file(s). Use Scan for PDFs."); addPhotos(imgs); });
["inScanCam","inScanImg","inScanPdf","inScanFiles"].forEach(function(id){ $(id).addEventListener("change", function(){ var f=Array.prototype.slice.call(this.files); this.value=""; runScanFiles(f); }); });
$("inReplace").addEventListener("change", function(){ var f=this.files[0]; this.value=""; if(f) arrReplaceFile(f); });
$("inImport").addEventListener("change", function(){ var f=this.files[0]; this.value=""; if(f) importFile(f); });
$("inLogo").addEventListener("change", function(){ var f=this.files[0]; this.value=""; if(!f) return; compressLogo(f).then(function(u){ state.meta.brand=state.meta.brand||{}; state.meta.brand.logo=u; if(saveMeta()!==false){ render(); showToast("Logo saved ("+fmtBytes(Math.round(u.length*0.75))+")"); } }).catch(function(e){ showToast("Logo failed: "+(e.message||e), {err:true}); }); });
window.addEventListener("resize", debounce(function(){ if(state.route.view==="print") fitSheet(); }, 150));
window.addEventListener("beforeprint", function(){ if(state.route.view==="print") fitSheet(); });
window.addEventListener("hashchange", onRoute);
window.addEventListener("pagehide", saveJobs);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") saveJobs(); });

function askPersist(){ try{ if(navigator.storage && navigator.storage.persist && !state.meta.persistAsked){ state.meta.persistAsked=true; saveMeta(); navigator.storage.persist(); } }catch(e){} }

/* ---------- service worker ---------- */
function registerSW(){
  if(!("serviceWorker" in navigator) || location.protocol==="file:") return;
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    function watch(w){ w.addEventListener("statechange", function(){ if(w.state==="installed" && navigator.serviceWorker.controller){ state.swUpdate=w; if(state.route.view==="list") render(); else showToast("Update ready", {act:function(){ w.postMessage("skipWaiting"); }, actLabel:"RELOAD", ms:15000}); } }); }
    if(reg.waiting && navigator.serviceWorker.controller){ state.swUpdate=reg.waiting; }
    if(reg.installing) watch(reg.installing);
    reg.addEventListener("updatefound", function(){ if(reg.installing) watch(reg.installing); });
  }).catch(function(e){ console.warn("SW registration failed", e); });
  var reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if(state.swUpdate && !reloading){ reloading=true; location.reload(); } });
}

/* ---------- init ---------- */
function init(){
  applyTheme();
  var r=document.createElement("div"); r.innerHTML='<div id="modalRoot"></div><div id="busyRoot"></div><div id="toastRoot"></div>'; while(r.firstChild) $("overlay").appendChild(r.firstChild);
  state.jobs = (lsGet(K.jobs, [])||[]).map(normalizeJob);
  state.templates = lsGet(K.tpl, [])||[];
  state.meta = lsGet(K.meta, {})||{};
  if(!state.meta.installedAt){ state.meta.installedAt=nowIso(); }
  if(!state.meta.seeded){
    var m = migrateV1();
    if(!state.jobs.length) seedExamples(); else saveJobs();
    state.meta.seeded=true; if(m) state.meta.migratedV1=m;
  } else if(!state.meta.cueSeeded && state.jobs.some(function(j){ return j.example; })){
    seedCueExample(); // upgrade from v2.0.x: add the reference-sheet example next to the existing examples
  }
  state.meta.cueSeeded = true;
  if(!state.jobs.length || state.jobs.some(function(j){ return j.schema===SCHEMA; })) saveJobs(); // persist migrated jobs
  saveMeta();
  onRoute();
  registerSW();
  if(window.matchMedia && matchMedia("(display-mode: standalone)").matches) askPersist();
  setTimeout(function(){
    var c=navigator.connection||{};
    if(!state.meta.ocrWarmAt && !c.saveData && c.type!=="cellular") warmOcr(false);
  }, 8000);
}
window.__tjl = {state:state, parseLines:parseLines, buildReview:buildReview, render:render};
init();
})();
</script>
